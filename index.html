<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons-filled.min.css"
    />
    <title>Text To Speech Converter</title>
  </head>
  <body>
    <div
      id="error-overlay"
      class="hidden fixed inset-0 z-40 bg-black/40 backdrop-blur-sm"
    ></div>

    <div
      id="error-card"
      class="hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 flex items-center gap-3 rounded-lg border border-red-500/30 bg-red-50 px-4 py-3 text-red-800 shadow-lg"
    >
      <span id="error-text" class="text-sm"></span>
      <button onclick="hideError()" class="text-red-500 hover:text-red-700">
        ✕
      </button>
    </div>
    <div
      class="w-full h-dvh bg-linear-25 from-sherpa-blue to-caribbian-green flex items-center justify-center flex-col"
    >
      <h1 class="text-white text-5xl font-black mb-8 tracking-tight">
        Text To Speech
        <span class="text-rose-950 underline underline-offset-8"
          >Converter</span
        >
      </h1>
      <textarea
        placeholder="Write anything here..."
        class="w-full max-w-xl h-64 bg-textarea/50 text-white text-[15px] p-5 border-0 rounded-[10px] resize-none mb-7 outline-0 placeholder:text-white placeholder:text-[16px]"
      ></textarea>
      <div class="w-150 flex items-center gap-5">
        <div class="flex-1 relative group">
          <select
            class="w-full text-white bg-select/50 h-12.5 py-0 pl-5 pr-10 outline-0 border-0 rounded-[10px] appearance-none"
          ></select>
          <i
            class="ti ti-caret-down absolute text-2xl right-4 top-1/2 -translate-y-1/2 text-white pointer-events-none transition-transform duration-150 group-has-[select:open]:rotate-180"
          ></i>
        </div>
        <button
          id="play-btn"
          class="bg-button/60 text-white text-[16px] py-3 px-5 rounded-[10px] border-0 outline-0 cursor-pointer flex items-center"
        >
          <i class="ti ti-player-play w-4 -ml-1 mr-2"></i>Listen
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
